<!doctype html>
<html lang="en" class="scroll-smooth bg-zinc-900 text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght@24,400&icon_names=unarchive,download,file_open,keyboard_arrow_up,edit_square&display=block"
    />
    <title>Archive Viewer</title>
  </head>

  <body class="selection:bg-emerald-400/60 selection:text-white">
    <div class="mx-auto flex min-h-dvh max-w-180 grow flex-col">
      <header class="flex-none py-3 sm:py-6">
        <h1 class="text-center font-mono text-2xl font-bold text-emerald-400 sm:text-3xl">Archive Viewer</h1>
      </header>
      <main class="grow">
        <section class="mb-2 px-2">
          <h2 class="mb-0.5 text-center text-sm text-zinc-400">View file or URL</h2>
          <form id="view-form" class="flex items-center gap-2">
            <div class="flex-none">
              <label
                for="file-picker"
                class="block w-full rounded-lg border border-emerald-400 p-1.5 text-emerald-400 transition-colors select-none focus-within:border-white focus-within:bg-zinc-600 focus-within:text-white hover:border-white hover:text-white has-disabled:opacity-50"
              >
                <span class="material-symbols-outlined block!" translate="no">file_open</span>
                <input id="file-picker" name="file" type="file" accept="application/zip" class="sr-only" />
              </label>
            </div>
            <div class="grow">
              <label for="url" class="sr-only">Archive URL</label>
              <div
                class="group flex gap-1.5 rounded-lg border border-zinc-600 p-1.5 transition-colors focus-within:border-white hover:not-focus-within:border-zinc-400 has-disabled:opacity-50"
              >
                <input
                  type="text"
                  name="url"
                  id="url"
                  pattern="https?://.*"
                  placeholder="https://example.com/archive.zip"
                  required
                  class="peer grow outline-0 placeholder:text-zinc-600"
                />
                <button
                  id="focus-input"
                  type="button"
                  class="flex-none text-zinc-600 transition-colors select-none group-hover:text-zinc-400 peer-focus:hidden peer-disabled:hidden hover:text-white"
                >
                  <span class="material-symbols-outlined block!" translate="no">edit_square</span>
                </button>
              </div>
            </div>
            <button id="view-button" form="view-form" type="submit" class="sr-only">View</button>
          </form>
          <progress
            max="1"
            value="0"
            class="invisible h-2 w-full rounded-full bg-zinc-600 accent-emerald-400 indeterminate:accent-amber-400"
          ></progress>
        </section>
        <div id="archive-view" class="opacity-100 transition-opacity inert:opacity-50"></div>
      </main>
      <footer class="flex-none pt-12 pb-3 text-sm text-zinc-400 sm:text-base">
        <div class="text-center">
          <a
            href="https://github.com/ValdezFOmar/archive-viewer"
            target="_blank"
            class="underline underline-offset-2 hover:text-white focus:text-white"
          >
            source
          </a>
        </div>
      </footer>
    </div>

    <!-- base template for viewing a single archive -->
    <template id="t-archive">
      <article class="mb-4 rounded-lg border border-zinc-600">
        <header class="rounded-t-lg border-b border-zinc-600 bg-zinc-800 p-2 sm:p-4">
          <h2 class="archive-name px-2 text-center text-lg font-medium wrap-break-word sm:mb-1 sm:text-xl"></h2>
          <p class="archive-details flex justify-center gap-1 text-sm text-zinc-400 sm:text-base">
            <span></span>&middot;<span></span>
          </p>
        </header>
        <ul class="archive-entries"></ul>
      </article>
    </template>

    <!-- base template used as a parent of the more specialized entry templates -->
    <template id="t-archive-entry">
      <li class="group border-t border-zinc-800 p-2 text-sm sm:p-4">
        <div class="flex items-center gap-2 not-only:mb-2 sm:not-only:mb-4">
          <div class="h-min grow pl-0.5">
            <h3 class="path pretty mb-0.5 font-mono wrap-anywhere sm:text-base"></h3>
            <div class="flex gap-1 text-xs text-zinc-400 sm:text-sm">
              <time></time>&middot;<span class="file-size"></span>
            </div>
          </div>
          <a
            class="flex-none rounded-full p-1 text-zinc-400 transition-colors select-none hover:text-white focus:bg-zinc-600 focus:text-white"
          >
            <span class="material-symbols-outlined block!" translate="no">download</span>
          </a>
        </div>
      </li>
    </template>

    <!-- display text contents -->
    <template id="t-archive-entry-text">
      <article class="rounded-sm border border-zinc-600 sm:text-base">
        <header class="flex items-center gap-2 border-b border-zinc-600 p-2">
          <div class="h-min grow">
            <h4 class="mr-3 ml-1 inline-block">Content</h4>
            <span class="lines text-sm text-zinc-400">0 lines</span>
          </div>
          <button
            type="button"
            class="flex-none rounded-sm border border-emerald-400 px-2 py-1 text-emerald-400 transition-colors select-none hover:border-white hover:text-white focus:border-white focus:bg-zinc-600 focus:text-white"
          >
            Copy
          </button>
        </header>
        <div class="max-h-52 overflow-scroll rounded-b-sm bg-zinc-800 p-2 sm:max-h-100">
          <pre class="font-mono text-sm whitespace-break-spaces tab-8 slashed-zero"></pre>
        </div>
      </article>
    </template>

    <!-- display button for extracting a nested archive -->
    <template id="t-archive-entry-extract">
      <button
        type="button"
        class="flex-none cursor-pointer rounded-full p-1 text-emerald-400 transition-colors hover:text-white focus:bg-zinc-600 focus:text-white disabled:text-zinc-600"
      >
        <span class="material-symbols-outlined block!" translate="no">unarchive</span>
      </button>
    </template>

    <!-- display image contents -->
    <template id="t-archive-entry-image">
      <img class="w-full border border-zinc-800 object-contain" />
    </template>

    <!-- display video player -->
    <template id="t-archive-entry-video">
      <video controls class="w-full border border-zinc-800 object-contain"></video>
    </template>

    <button
      id="scroll-top"
      type="button"
      hidden
      class="fixed right-4 bottom-8 rounded-full bg-emerald-400/80 p-4 opacity-100 shadow transition-opacity duration-300 text-shadow-md md:right-8 starting:opacity-0"
    >
      <span class="material-symbols-outlined block!" translate="no">keyboard_arrow_up</span>
    </button>

    <dialog
      id="archive-password-dialog"
      closedby="none"
      class="mx-auto mt-10 w-11/12 max-w-100 rounded-4xl bg-zinc-800 text-white shadow-2xl/30 backdrop:bg-black/35"
    >
      <div class="px-8 py-4 sm:text-lg">
        <header class="py-4 text-center">
          <h2 class="text-xl font-medium sm:text-2xl">Password required</h2>
        </header>
        <form method="dialog">
          <div class="mb-4">
            <label for="password" class="inline-block pb-2">Password:</label>
            <input
              id="password"
              type="password"
              name="password"
              value=""
              required
              autofocus
              class="block w-full rounded-lg border border-white p-2 font-mono outline-0 focus:ring-2 focus:ring-white"
            />
          </div>
          <div class="flex justify-end gap-2 pr-1 text-center text-sm font-bold sm:text-base">
            <button
              id="cancel"
              type="button"
              value="cancel"
              command="close"
              commandfor="archive-password-dialog"
              class="rounded-full px-4 py-2 transition-colors hover:bg-zinc-600"
            >
              Cancel
            </button>
            <button type="submit" value="confirm" class="rounded-full px-4 py-2 transition-colors hover:bg-zinc-600">
              Ok
            </button>
          </div>
        </form>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
