<!doctype html>
<html lang="en" class="bg-zinc-900 text-zinc-200">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght@24,400&icon_names=unarchive&display=block"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive Viewer</title>
  </head>

  <body>
    <div class="flex min-h-dvh grow flex-col">
      <header class="flex-none py-3">
        <h1 class="text-center font-mono text-2xl font-bold text-emerald-400">
          <a href="%BASE_URL%">Archive Viewer</a>
        </h1>
      </header>
      <main class="grow">
        <section class="px-2">
          <form id="view-form">
            <label for="url" class="block text-center text-sm text-zinc-400">Archive URL</label>
            <div class="flex">
              <input
                type="text"
                name="url"
                id="url"
                pattern="https?://.*"
                placeholder="https://example.com/archive.zip"
                required
                class="grow rounded-l-lg border border-r-0 border-zinc-600 px-2 py-0.5 outline-0 placeholder:text-zinc-600 hover:not-focus:border-zinc-400 focus:border-emerald-400 disabled:text-zinc-400"
              />
              <button
                id="view-button"
                form="view-form"
                type="submit"
                class="flex-none rounded-r-lg bg-emerald-400 p-1 text-zinc-900 transition duration-300 ease-out hover:bg-white active:bg-white disabled:bg-zinc-600 disabled:text-zinc-200"
              >
                <span class="material-symbols-outlined block!">unarchive</span>
              </button>
            </div>
          </form>
          <progress
            hidden
            max="10"
            value="5"
            class="h-2 w-full rounded-full bg-zinc-600 accent-emerald-400 indeterminate:accent-amber-400"
          ></progress>
        </section>
        <div id="archive-view"></div>
      </main>
      <footer class="flex-none pt-12 pb-3 text-sm text-zinc-400">
        <div class="text-center">
          <a
            href="https://github.com/ValdezFOmar/archive-viewer"
            target="_blank"
            class="underline underline-offset-2 hover:text-white active:text-white"
          >
            source
          </a>
        </div>
      </footer>
    </div>

    <!-- base template for viewing a single archive -->
    <template id="t-archive">
      <section class="mt-6">
        <hgroup class="mb-1 px-2 text-center">
          <h2 class="text-xl font-medium underline underline-offset-4">Archive Contents</h2>
          <p class="sub-heading text-sm wrap-break-word text-zinc-400"></p>
        </hgroup>
        <div class="rounded-lg border border-zinc-600">
          <section class="rounded-t-lg border-b border-zinc-600 bg-zinc-800 p-2">
            <h3 class="mb-1 text-lg font-medium">Details</h3>
            <ul class="archive-details flex justify-start gap-6">
              <li><span class="text-zinc-400">Files: </span></li>
              <li><span class="text-zinc-400">Size: </span></li>
            </ul>
          </section>
          <section>
            <h3 class="p-2 text-lg font-medium">Entries</h3>
            <ul class="archive-entries"></ul>
          </section>
        </div>
      </section>
    </template>

    <!-- base template used as a parent of the more specialized entry templates -->
    <template id="t-archive-entry">
      <li class="group border-t border-zinc-800 p-2 text-sm">
        <span class="flex gap-2 not-only:mb-1">
          <span class="grow wrap-anywhere">
            <a class="file-path inline-block align-middle hover:text-white hover:underline active:text-white"></a>
          </span>
        </span>
      </li>
    </template>

    <!-- display text contents -->
    <template id="t-archive-entry-text">
      <article class="group rounded-sm border border-zinc-600">
        <header class="flex items-center gap-2 border-b border-zinc-600 p-2">
          <div class="h-min grow">
            <h4 class="mr-2 inline-block">Content</h4>
            <span class="lines text-zinc-400">0 lines</span>
          </div>
          <button
            type="button"
            class="flex-none rounded-sm border border-emerald-400 px-2 py-1 text-emerald-400 active:border-white active:bg-zinc-600 active:text-white"
          >
            Copy
          </button>
        </header>
        <div class="max-h-52 overflow-scroll rounded-b-sm bg-zinc-800 p-2">
          <pre class="font-mono whitespace-break-spaces tab-8 slashed-zero"></pre>
        </div>
      </article>
    </template>

    <!-- display button for extracting a nested archive -->
    <template id="t-archive-entry-extract">
      <button type="button" class="flex-none text-emerald-400 active:text-white">
        <span class="material-symbols-outlined block!">unarchive</span>
      </button>
    </template>

    <!-- display image contents -->
    <template id="t-archive-entry-image">
      <img class="object-contain" />
    </template>

    <!-- display video player -->
    <template id="t-archive-entry-video">
      <video controls class="object-contain"></video>
    </template>

    <dialog
      id="archive-password-dialog"
      closedby="none"
      class="fixed top-1/4 left-1/2 w-4/5 -translate-1/2 rounded-4xl bg-zinc-800 text-zinc-200 shadow-2xl/30 backdrop:bg-black/35"
    >
      <div class="p-8">
        <header class="mb-4 text-center">
          <h2 class="text-xl font-medium">Password required</h2>
        </header>
        <form method="dialog">
          <div class="mb-2">
            <label for="password" class="mb-1">Password:</label>
            <input
              id="password"
              type="password"
              name="password"
              value=""
              required
              autofocus
              class="block w-full rounded-lg border border-zinc-600 p-1 font-mono outline-0 focus:border-white"
            />
          </div>
          <div class="grid grid-cols-2 gap-2 text-center">
            <button
              type="submit"
              value="confirm"
              class="rounded-lg border border-emerald-400 px-2 py-1 text-emerald-400 active:border-white active:bg-zinc-600 active:text-white"
            >
              Confirm
            </button>
            <button
              id="cancel"
              type="button"
              value="cancel"
              command="close"
              commandfor="archive-password-dialog"
              class="rounded-lg border border-zinc-400 px-2 py-1 text-zinc-400 active:border-white active:bg-zinc-600 active:text-white"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
