<!doctype html>
<html lang="en" class="bg-zinc-900 text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght@24,400&icon_names=unarchive,download,file_open&display=block"
    />
    <title>Archive Viewer</title>
  </head>

  <body>
    <div class="mx-auto flex min-h-dvh max-w-180 grow flex-col">
      <header class="flex-none py-3 sm:py-6">
        <h1 class="text-center font-mono text-2xl font-bold text-emerald-400 sm:text-3xl">
          <a href="%BASE_URL%">Archive Viewer</a>
        </h1>
      </header>
      <main class="grow">
        <section class="px-2">
          <h2 class="mb-0.5 text-center text-sm text-zinc-400">View file or URL</h2>
          <form id="view-form" class="flex items-center gap-2">
            <div class="flex-none">
              <label
                for="file-picker"
                class="block w-full rounded-lg border border-emerald-400 p-1.5 text-emerald-400 select-none focus-within:border-white focus-within:bg-zinc-600 focus-within:text-white hover:border-white hover:text-white"
              >
                <span class="material-symbols-outlined block!">file_open</span>
                <input id="file-picker" name="file" type="file" accept="application/zip" class="sr-only" />
              </label>
            </div>
            <div class="grow">
              <label for="url" class="sr-only">Archive URL</label>
              <input
                type="text"
                name="url"
                id="url"
                pattern="https?://.*"
                placeholder="https://example.com/archive.zip"
                required
                class="w-full rounded-lg border border-zinc-600 px-2 py-1.5 outline-0 placeholder:text-zinc-600 hover:not-focus:border-zinc-400 focus:border-white disabled:opacity-50"
              />
            </div>
            <button id="view-button" form="view-form" type="submit" class="sr-only">View</button>
          </form>
          <progress
            hidden
            max="1"
            value="0"
            class="h-2 w-full rounded-full bg-zinc-600 accent-emerald-400 indeterminate:accent-amber-400"
          ></progress>
        </section>
        <div id="archive-view"></div>
      </main>
      <footer class="flex-none pt-12 pb-3 text-sm text-zinc-400 sm:text-base">
        <div class="text-center">
          <a
            href="https://github.com/ValdezFOmar/archive-viewer"
            target="_blank"
            class="underline underline-offset-2 hover:text-white focus:text-white"
          >
            source
          </a>
        </div>
      </footer>
    </div>

    <!-- base template for viewing a single archive -->
    <template id="t-archive">
      <article class="mt-6">
        <hgroup class="mb-1 px-2 text-center">
          <h2 class="text-xl font-medium underline underline-offset-4">Archive Contents</h2>
          <p class="archive-name text-sm wrap-break-word text-zinc-400 sm:text-base"></p>
        </hgroup>
        <div class="rounded-lg border border-zinc-600">
          <section class="rounded-t-lg border-b border-zinc-600 bg-zinc-800 p-2 sm:p-4">
            <h3 class="mb-1 text-lg font-medium sm:mb-2 sm:text-xl">Details</h3>
            <ul class="archive-details flex justify-start gap-6 sm:text-lg">
              <li><span class="text-zinc-400">Files: </span></li>
              <li><span class="text-zinc-400">Size: </span></li>
            </ul>
          </section>
          <section>
            <h3 class="p-2 text-lg font-medium sm:p-4 sm:text-xl">Entries</h3>
            <ul class="archive-entries"></ul>
          </section>
        </div>
      </article>
    </template>

    <!-- base template used as a parent of the more specialized entry templates -->
    <template id="t-archive-entry">
      <li class="group border-t border-zinc-800 p-2 text-sm sm:p-4">
        <div class="flex items-center gap-2 not-only:mb-2">
          <div class="h-min grow pl-0.5">
            <h4 class="path pretty mb-0.5 font-mono wrap-anywhere"></h4>
            <div class="text-xs text-zinc-400 sm:text-sm">
              <time class="mr-2"></time>
              <span class="file-size"></span>
            </div>
          </div>
          <a class="flex-none rounded-full p-1 text-zinc-400 hover:text-white focus:bg-zinc-600 focus:text-white">
            <span class="material-symbols-outlined block!">download</span>
          </a>
        </div>
      </li>
    </template>

    <!-- display text contents -->
    <template id="t-archive-entry-text">
      <article class="rounded-sm border border-zinc-600 sm:text-base">
        <header class="flex items-center gap-2 border-b border-zinc-600 p-2">
          <div class="h-min grow">
            <h5 class="mr-3 ml-1 inline-block">Content</h5>
            <span class="lines text-sm text-zinc-400">0 lines</span>
          </div>
          <button
            type="button"
            class="flex-none rounded-sm border border-emerald-400 px-2 py-1 text-emerald-400 hover:border-white hover:text-white focus:border-white focus:bg-zinc-600 focus:text-white"
          >
            Copy
          </button>
        </header>
        <div class="max-h-52 overflow-scroll rounded-b-sm bg-zinc-800 p-2 sm:max-h-100">
          <pre class="font-mono text-sm whitespace-break-spaces tab-8 slashed-zero"></pre>
        </div>
      </article>
    </template>

    <!-- display button for extracting a nested archive -->
    <template id="t-archive-entry-extract">
      <button
        type="button"
        class="flex-none cursor-pointer rounded-full p-1 text-emerald-400 hover:text-white focus:bg-zinc-600 focus:text-white disabled:text-zinc-600"
      >
        <span class="material-symbols-outlined block!">unarchive</span>
      </button>
    </template>

    <!-- display image contents -->
    <template id="t-archive-entry-image">
      <img class="object-contain" />
    </template>

    <!-- display video player -->
    <template id="t-archive-entry-video">
      <video controls class="object-contain"></video>
    </template>

    <dialog
      id="archive-password-dialog"
      closedby="none"
      class="fixed top-1/4 left-1/2 w-5/6 max-w-100 -translate-1/2 rounded-4xl bg-zinc-800 text-white shadow-2xl/30 backdrop:bg-black/35"
    >
      <div class="p-8 sm:text-lg">
        <header class="mb-4 text-center">
          <h2 class="text-xl font-medium sm:text-2xl">Password required</h2>
        </header>
        <form method="dialog">
          <div class="mb-2">
            <label for="password" class="mb-1">Password:</label>
            <input
              id="password"
              type="password"
              name="password"
              value=""
              required
              autofocus
              class="block w-full rounded-lg border border-zinc-600 p-1 font-mono outline-0 focus:ring-2 focus:ring-white"
            />
          </div>
          <div class="grid grid-cols-2 gap-2 text-center">
            <button
              id="cancel"
              type="button"
              value="cancel"
              command="close"
              commandfor="archive-password-dialog"
              class="rounded-lg border border-zinc-400 px-2 py-1 text-zinc-400 hover:border-white hover:text-white focus:border-white focus:bg-zinc-600 focus:text-white"
            >
              Cancel
            </button>
            <button
              type="submit"
              value="confirm"
              class="rounded-lg border border-emerald-400 px-2 py-1 text-emerald-400 hover:border-white hover:text-white focus:border-white focus:bg-zinc-600 focus:text-white"
            >
              Confirm
            </button>
          </div>
        </form>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
