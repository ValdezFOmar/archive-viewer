<!doctype html>
<html lang="en" class="bg-zinc-900 text-zinc-200">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=unarchive"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIP Archive Viewer</title>
  </head>

  <body class="flex min-h-dvh flex-col px-2">
    <header class="py-3">
      <h1 class="text-center font-mono text-2xl font-bold text-emerald-400">
        ZIP Archive Viewer
      </h1>
    </header>
    <main class="grow">
      <section class="px-2 pb-4">
        <form id="view-form">
          <label
            for="url"
            class="block pb-0.5 text-center text-sm text-zinc-400"
            >Archive URL</label
          >
          <div class="flex">
            <input
              type="text"
              name="url"
              id="url"
              pattern="https?://.*"
              placeholder="https://example.com/archive.zip"
              required
              class="grow rounded-l-lg border border-r-0 border-zinc-500 px-2 py-0.5 focus:outline-1 focus:outline-emerald-400"
            />
            <button
              id="view-button"
              form="view-form"
              type="submit"
              class="flex-none rounded-r-lg bg-emerald-400 p-1 text-zinc-900 hover:bg-emerald-200 focus:bg-emerald-200 disabled:bg-emerald-600"
            >
              <span class="flex items-center justify-center">
                <span class="material-symbols-outlined">unarchive</span>
              </span>
            </button>
          </div>
        </form>
      </section>
      <section id="archive-view" hidden>
        <h2 class="text-center">Archive contents</h2>
        <div id="archive-content">
          <section class="pb-2">
            <h3 class="pl-1 text-sm text-zinc-400 italic">Details</h3>
            <p id="archive-details" class="pl-1">Files: 0; Size: 0 MB</p>
          </section>
          <section>
            <h3 class="pb-1.5 pl-1 text-sm text-zinc-400 italic">Entries</h3>
            <ul
              id="archive-entries"
              class="rounded-lg border-2 border-zinc-700"
            ></ul>
            <!-- base template used as a parent of the more specialized entry templates -->
            <template id="t-archive-entry">
              <li class="border-b-2 border-zinc-700 last:border-b-0">
                <div class="px-2 py-0.5">
                  <span class="file-path font-mono text-sm"></span>
                </div>
              </li>
            </template>
            <!-- display text contents -->
            <template id="t-archive-entry-text">
              <details class="text-zinc-400">
                <summary>contents</summary>
                <pre class="file-contents overflow-scroll"></pre>
              </details>
            </template>
            <!-- display image contents -->
            <template id="t-archive-entry-image">
              <img src="" class="object-contain last:rounded-b-lg" />
            </template>
          </section>
        </div>
      </section>
    </main>
    <address class="flex-none pt-8 pb-2 text-zinc-500">
      <div class="flex justify-center gap-6">
        <a
          href="https://github.com/ValdezFOmar"
          rel="author"
          target="_blank"
          class="underline hover:text-emerald-400"
        >
          author
        </a>
        <a
          href="https://github.com/ValdezFOmar/archive-viewer"
          target="_blank"
          class="underline hover:text-emerald-400"
        >
          source
        </a>
      </div>
    </address>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
