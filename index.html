<!doctype html>
<html lang="en" class="bg-zinc-900 text-zinc-200">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=unarchive"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIP Archive Viewer</title>
  </head>

  <body class="flex min-h-dvh flex-col px-2">
    <header class="py-3">
      <h1 class="text-center font-mono text-2xl font-bold text-emerald-400">
        <a href="%BASE_URL%">ZIP Archive Viewer</a>
      </h1>
    </header>
    <main class="grow">
      <section class="px-2 pb-4">
        <form id="view-form">
          <label
            for="url"
            class="block pb-0.5 text-center text-sm text-zinc-400"
          >
            Archive URL
          </label>
          <div class="flex">
            <input
              type="text"
              name="url"
              id="url"
              pattern="https?://.*"
              placeholder="https://example.com/archive.zip"
              required
              class="grow rounded-l-lg border border-r-0 border-zinc-500 px-2 py-0.5 transition duration-300 ease-out hover:not-focus:border-zinc-400 focus:outline-1 focus:outline-emerald-400 disabled:text-zinc-500"
            />
            <button
              id="view-button"
              form="view-form"
              type="submit"
              class="flex-none rounded-r-lg bg-emerald-400 p-1 text-zinc-900 transition duration-300 ease-out hover:bg-white disabled:bg-zinc-500"
            >
              <span class="flex items-center justify-center">
                <span class="material-symbols-outlined">unarchive</span>
              </span>
            </button>
          </div>
        </form>
        <progress
          hidden
          max="1"
          value="0"
          class="h-2 w-full rounded-full bg-zinc-700 accent-emerald-400 indeterminate:accent-amber-400"
        ></progress>
      </section>
      <section id="archive-view" hidden>
        <h2 class="text-center">Archive contents</h2>
        <div id="archive-content">
          <section class="pb-2">
            <h3 class="pb-1.5 pl-1 text-sm text-zinc-400 italic">Details</h3>
            <ul
              id="archive-details"
              class="inline-flex justify-start rounded-lg border-2 border-zinc-600 bg-zinc-800 block-auto"
            >
              <li class="border-r-2 border-zinc-600 px-2 py-1 last:border-0">
                Files: 0
              </li>
              <li class="border-r-2 border-zinc-600 px-2 py-1 last:border-0">
                Size: 0
              </li>
            </ul>
          </section>
          <section>
            <h3 class="pb-1.5 pl-1 text-sm text-zinc-400 italic">Entries</h3>
            <ul
              id="archive-entries"
              class="rounded-lg border-2 border-zinc-600"
            ></ul>
            <!-- base template used as a parent of the more specialized entry templates -->
            <template id="t-archive-entry">
              <li
                class="group border-b-2 border-zinc-600 bg-zinc-800 text-sm first:rounded-t-md last:rounded-b-md last:border-b-0"
              >
                <div class="px-2 py-1">
                  <p class="file-path tracking-wide break-all"></p>
                </div>
              </li>
            </template>
            <!-- display text contents -->
            <template id="t-archive-entry-text">
              <div class="has-open:py-1">
                <details
                  class="group/details border-zinc-600 group-last:rounded-b-md open:border open:bg-zinc-900"
                >
                  <summary
                    class="cursor-default border-zinc-600 text-emerald-400 transition duration-300 ease-out group-open/details:border-b group-open/details:py-1 group-open/details:pl-2 hover:text-white"
                  >
                    contents
                  </summary>
                  <div class="px-1.5 py-1">
                    <pre
                      class="file-contents max-h-90 overflow-scroll whitespace-break-spaces"
                    ></pre>
                  </div>
                </details>
              </div>
            </template>
            <!-- display image contents -->
            <template id="t-archive-entry-image">
              <div class="flex justify-center">
                <img
                  src=""
                  class="flex-none object-contain group-last:rounded-b-md"
                />
              </div>
            </template>
            <!-- display video player -->
            <template id="t-archive-entry-video">
              <div class="flex justify-center">
                <video
                  src=""
                  controls
                  class="flex-none object-contain group-last:rounded-b-md"
                ></video>
              </div>
            </template>
          </section>
        </div>
      </section>
    </main>
    <address class="flex-none pt-8 pb-2 text-sm text-zinc-500">
      <div class="flex justify-center gap-6">
        <a
          href="https://github.com/ValdezFOmar"
          rel="author"
          target="_blank"
          class="underline hover:text-emerald-400"
        >
          author
        </a>
        <a
          href="https://github.com/ValdezFOmar/archive-viewer"
          target="_blank"
          class="underline hover:text-emerald-400"
        >
          source
        </a>
      </div>
    </address>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
